name: Something does not work
description: A bug in the app or the tools.
body:
  - type: markdown
    attributes:
      value: "**Never post the coordinates of a site or a find,** in words, screenshots or files. Describe the place by region only."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open ...  2. Press ...  3. See ..."
  - type: input
    id: version
    attributes:
      label: macOS version, Mac, and Dighouse version (Dighouse menu, About Dighouse) or the commit you built
  - type: textarea
    id: logs
    attributes:
      label: Messages or logs
      description: Remove anything that names a place more exactly than a region.
      render: text
